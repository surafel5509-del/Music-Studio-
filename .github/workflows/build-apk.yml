name: Build APK

on:
  push:
    branches: [ main, master, arena/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  native-tests:
    name: Native engine tests (host, sanitizers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FLAC decode check dependencies
        run: pip install soundfile numpy

      - name: Run native engine tests (ASan + UBSan + TSan)
        run: scripts/run_native_tests.sh

  build:
    name: Build WaveStudio APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Install Android command-line tools
        run: |
          set -e
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          CMDFN=commandlinetools-linux-11076708_latest.zip
          wget -q https://dl.google.com/android/repository/$CMDFN -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install required Android SDK components
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1" 2>&1 | tail -20
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Create keystore for release build
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias wavestudio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${WS_STORE_PASS:-wavestudio}" \
            -keypass "${WS_KEY_PASS:-wavestudio}" \
            -dname "CN=WaveStudio, O=WaveStudio, L=Mobile, ST=CA, C=US"
        env:
          WS_STORE_PASS: ${{ secrets.WS_STORE_PASS }}
          WS_KEY_PASS: ${{ secrets.WS_KEY_PASS }}

      - name: Build debug APK
        if: github.event.inputs.buildType != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log | tail -400

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error

      - name: Emit errors inline
        if: failure()
        run: |
          echo "### Build errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -nE "(^e:| error:| FAILED|Caused by:|exception:|^FAILURE:|^> Task|BUILD FAILED)" build.log | tail -200 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== Emitting errors as annotations ==="
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -nE "(^e: | error: | FAILED$|Caused by:|BUILD FAILED)" build.log | head -80)
          echo "=== Tail 400 of build.log ==="
          tail -400 build.log

      - name: Build release APK
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log | tail -300
        env:
          WS_STORE_PASS: ${{ secrets.WS_STORE_PASS || 'wavestudio' }}
          WS_KEY_PASS: ${{ secrets.WS_KEY_PASS || 'wavestudio' }}

      - name: Prepare APK artifact
        id: apk
        run: |
          set -e
          if [ "${{ github.event.inputs.buildType }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VARIANT=release
          else
            VARIANT=debug
          fi
          mkdir -p apk-out
          echo "=== Searching for APKs ==="
          find app/build -name "*.apk" -type f || true
          APK=$(find app/build/outputs/apk/$VARIANT -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced - listing outputs:"
            find app/build/outputs -type f 2>&1 | head -100 || true
            find app/build -maxdepth 6 -type d 2>&1 | head -100 || true
            exit 1
          fi
          OUT="apk-out/WaveStudio-$VARIANT.apk"
          cp -v "$APK" "$OUT"
          ls -la apk-out/
          echo "APK_SIZE=$(stat -c%s "$OUT")"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavestudio-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Run JVM unit tests (project format, edit ops, undo, engine sync)
        if: github.event.inputs.buildType != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log | tail -150

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: WaveStudio ${{ github.ref_name }}
          draft: false
          prerelease: false
