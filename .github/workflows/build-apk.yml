name: Build APK

on:
  push:
    branches: [ main, master, arena/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build WaveStudio APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Install Android command-line tools
        run: |
          set -e
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          CMDFN=commandlinetools-linux-11076708_latest.zip
          wget -q https://dl.google.com/android/repository/$CMDFN -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install required Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1" 2>&1 | tail -20

      - name: Create keystore for release build
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias wavestudio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${WS_STORE_PASS:-wavestudio}" \
            -keypass "${WS_KEY_PASS:-wavestudio}" \
            -dname "CN=WaveStudio, O=WaveStudio, L=Mobile, ST=CA, C=US"
        env:
          WS_STORE_PASS: ${{ secrets.WS_STORE_PASS }}
          WS_KEY_PASS: ${{ secrets.WS_KEY_PASS }}

      - name: Build debug APK
        if: github.event.inputs.buildType != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log | tail -300

      - name: Build release APK
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tail -300
        env:
          WS_STORE_PASS: ${{ secrets.WS_STORE_PASS || 'wavestudio' }}
          WS_KEY_PASS: ${{ secrets.WS_KEY_PASS || 'wavestudio' }}

      - name: Prepare APK artifact
        run: |
          set -e
          mkdir -p apk-out
          echo "=== Searching for APKs ==="
          find app/build -name "*.apk" -type f || true
          APK=$(find app/build -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced - listing outputs:"
            find app/build/outputs -type f 2>&1 | head -100 || true
            find app/build -maxdepth 6 -type d 2>&1 | head -100 || true
            exit 1
          fi
          cp -v "$APK" apk-out/WaveStudio-debug.apk
          ls -la apk-out/
          echo "APK_SIZE=$(stat -c%s apk-out/WaveStudio-debug.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavestudio-apk
          path: apk-out/WaveStudio-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: WaveStudio ${{ github.ref_name }}
          draft: false
          prerelease: false
