name: Build APK

on:
  push:
    branches: [ main, master, arena/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build WaveStudio APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Locate preinstalled Android SDK
        id: sdk
        run: |
          # ubuntu-latest ships an Android SDK at $ANDROID_SDK_ROOT / $ANDROID_HOME
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          else
            echo "No Android SDK found; installing command-line tools"
            SDK=$HOME/android-sdk
            mkdir -p "$SDK/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "sdk=$SDK" >> $GITHUB_OUTPUT
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install required Android SDK components
        run: |
          SDK="$ANDROID_SDK_ROOT"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            # Try other common paths used by preinstalled runner images
            for p in "$SDK/cmdline-tools/bin/sdkmanager" \
                     "$SDK/tools/bin/sdkmanager"; do
              if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
            done
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Create keystore for release build
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias wavestudio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${WS_STORE_PASS:-wavestudio}" \
            -keypass "${WS_KEY_PASS:-wavestudio}" \
            -dname "CN=WaveStudio, O=WaveStudio, L=Mobile, ST=CA, C=US"
        env:
          WS_STORE_PASS: ${{ secrets.WS_STORE_PASS }}
          WS_KEY_PASS: ${{ secrets.WS_KEY_PASS }}

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        if: github.event.inputs.buildType != 'release' && !startsWith(github.ref, 'refs/tags/')
        id: build_debug
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build release APK
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        id: build_release
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        shell: bash
        env:
          WS_STORE_PASS: ${{ secrets.WS_STORE_PASS || 'wavestudio' }}
          WS_KEY_PASS: ${{ secrets.WS_KEY_PASS || 'wavestudio' }}

      - name: Check build result
        run: |
          if [ -f build-debug.log ] && grep -q "BUILD SUCCESSFUL" build-debug.log; then exit 0; fi
          if [ -f build-release.log ] && grep -q "BUILD SUCCESSFUL" build-release.log; then exit 0; fi
          echo "Build failed."; exit 1

      - name: Upload build log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect APK path
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            echo "name=WaveStudio-release.apk" >> $GITHUB_OUTPUT
          else
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            echo "name=WaveStudio-debug.apk" >> $GITHUB_OUTPUT
          fi
          ls -la app/build/outputs/apk/
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true
          ls -la app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavestudio-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: WaveStudio ${{ github.ref_name }}
          draft: false
          prerelease: false
