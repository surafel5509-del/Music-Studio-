name: Build APK

on:
  push:
    branches: [ main, master, arena/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build WaveStudio APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1" \
            "platform-tools" 2>&1 | tail -20

      - name: Create keystore for release build
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias wavestudio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${WS_STORE_PASS:-wavestudio}" \
            -keypass "${WS_KEY_PASS:-wavestudio}" \
            -dname "CN=WaveStudio, O=WaveStudio, L=Mobile, ST=CA, C=US"
        env:
          WS_STORE_PASS: ${{ secrets.WS_STORE_PASS }}
          WS_KEY_PASS: ${{ secrets.WS_KEY_PASS }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        if: github.event.inputs.buildType != 'release' && !startsWith(github.ref, 'refs/tags/')
        id: build_debug
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tail -200

      - name: Build release APK
        if: github.event.inputs.buildType == 'release' || startsWith(github.ref, 'refs/tags/')
        id: build_release
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tail -200
        env:
          WS_STORE_PASS: ${{ secrets.WS_STORE_PASS || 'wavestudio' }}
          WS_KEY_PASS: ${{ secrets.WS_KEY_PASS || 'wavestudio' }}

      - name: Locate APK
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=WaveStudio-release.apk" >> "$GITHUB_OUTPUT"
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=WaveStudio-debug.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::error::APK not found. Build listing follows:"
            find app/build/outputs -type f -name "*.apk" -o -name "*.aab" 2>/dev/null || true
            ls -R app/build/outputs/apk/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavestudio-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: WaveStudio ${{ github.ref_name }}
          draft: false
          prerelease: false
